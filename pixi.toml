[workspace]
name = "finaledb-preprocessing"
version = "1.0.0"
description = "Download FinaleDB fragment files and rebuild BAMs with a modified Fragmentstein"
channels = ["conda-forge", "bioconda"]
# bioconda builds samtools, htslib and bedtools for Linux and macOS only
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
# versions recorded in the @PG lines of the original BAMs (README, Section 8): samtools 1.21, bedtools 2.31.1 (all Jiang and the 275
# Cristiano BAMs of 2025; the 263 Cristiano BAMs of 2024 were written with samtools 1.16.1-1.20 and, for one record,
# bedtools 2.30.0 - see README, "Provenance of the published BAMs")
samtools = "==1.21"
htslib = "==1.21"        # tabix, bgzip
bedtools = "==2.31.1"    # bedToBam, bedtools getfasta
gawk = "5.3.*"
coreutils = "*"          # md5sum, GNU wc/stat on macOS
curl = "*"
python = "3.12.*"
requests = "2.32.*"

[feature.bigwig.dependencies]
# optional bigWig tracks (fragmentstein_finaledb.sh --bigwig)
deeptools = "3.5.*"

[environments]
bigwig = ["bigwig"]

[tasks]
download = "bash scripts/download.sh"
convert = "bash scripts/convert.sh"
index = "bash scripts/index.sh"
metadata = "python scripts/fetch_metadata.py"
chr21-test = "bash scripts/make_chr21_test.sh"
